# スマホ版（pwa/）を GitHub Pages に載せる。辞書（pwa/dict/）はここで EJDict から作る。
name: pages
on:
  push:
    branches: [master]
    paths: ["pwa/**", "assets/shared.js", "tools/build_pwa_dict.py", "tools/build_dict.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 辞書を作る
        run: python tools/build_pwa_dict.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
